<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Chatbot Chaleureux</title>
  <style>
    /* ---- STYLE GÉNÉRAL & PALETTE DE COULEURS ---- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background-color: #faf6f0; /* Fond beige/crème très doux */
      color: #3d342e; /* Texte marron foncé doux (moins agressif que le noir) */
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ---- EN-TÊTE ---- */
    header {
      background-color: #ffffff;
      padding: 15px 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(213, 114, 59, 0.08);
      border-bottom: 1px solid #f0e6db;
    }

    header h1 {
      font-size: 1.4rem;
      color: #d54617; /* Orange Terracotta chaleureux */
      font-weight: 600;
    }

    /* ---- ZONE DE DISCUSSION (CHAT) ---- */
    /* On remplace la balise <pre> par une div plus moderne pour gérer les bulles */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Style de base d'un message */
    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 1rem;
      line-height: 1.5;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease;
    }

    /* Bulle de l'utilisateur (à droite, tons orange cuivré doux) */
    .user-message {
      background-color: #e66b37;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 6px rgba(230, 107, 55, 0.2);
    }

    /* Bulle du Bot (à gauche, tons crème/blanc et bordure ambre) */
    .bot-message {
      background-color: #ffffff;
      color: #3d342e;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid #ebdcd0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }

    /* Bulle d'erreur */
    .error-message {
      background-color: #fcece6;
      color: #c84113;
      align-self: center;
      border-radius: 10px;
      font-size: 0.9rem;
      border: 1px dashed #f5c0b0;
    }

    /* ---- BARRE DE SAISIE (EN BAS) ---- */
    .input-container {
      background-color: #ffffff;
      border-top: 1px solid #f0e6db;
      padding: 20px;
    }

    .input-wrapper {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      background-color: #fcfaf7;
      border: 1px solid #dfd0c4;
      padding: 8px 12px;
      border-radius: 24px;
      transition: all 0.2s ease;
    }

    /* Effet orange lumineux discret quand on clique sur la zone de texte */
    .input-wrapper:focus-within {
      border-color: #e66b37;
      box-shadow: 0 0 0 3px rgba(230, 107, 55, 0.15);
      background-color: #ffffff;
    }

    input[type="text"] {
      flex: 1;
      border: none;
      background: none;
      outline: none;
      font-size: 1rem;
      color: #3d342e;
      padding: 4px;
    }

    input[type="text"]::placeholder {
      color: #a3958c;
    }

    button {
      background-color: #e66b37;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 18px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:hover {
      background-color: #cc5624; /* Orange un peu plus sombre au survol */
    }

    button:active {
      transform: scale(0.97);
    }

    /* Petite animation d'apparition des messages */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>Mon Assistant IA</h1>
  </header>

  <div id="chat-container">
    <div class="message bot-message">Bonjour ! Comment puis-je vous aider aujourd'hui ? ☕</div>
  </div>

  <div class="input-container">
    <div class="input-wrapper">
      <input type="text" id="message" placeholder="Posez votre question ici..." onkeydown="if(event.key === 'Enter') sendMessage()">
      <button onclick="sendMessage()">Envoyer</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById("message");
      const chatContainer = document.getElementById("chat-container");
      const messageText = input.value.trim();

      if (messageText === "") return;

      // 1. Afficher le message de l'utilisateur
      const userDiv = document.createElement("div");
      userDiv.className = "message user-message";
      userDiv.textContent = messageText;
      chatContainer.appendChild(userDiv);

      // Effacer le champ de saisie immédiatement
      input.value = "";
      
      // Faire défiler automatiquement vers le bas
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        // 2. Envoyer la requête au serveur (chemin relatif pour Render/Local)
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: messageText
          })
        });

        const data = await response.json();

        // 3. Afficher la réponse du Bot
        const botDiv = document.createElement("div");
        
        // On vérifie si le serveur a renvoyé une erreur ou une réponse valide
        if (data.reply.startsWith("Erreur")) {
          botDiv.className = "message error-message";
        } else {
          botDiv.className = "message bot-message";
        }
        
        botDiv.textContent = data.reply;
        chatContainer.appendChild(botDiv);

      } catch (error) {
        // En cas de panne de connexion
        const errorDiv = document.createElement("div");
        errorDiv.className = "message error-message";
        errorDiv.textContent = "Erreur : Impossible de joindre le serveur.";
        chatContainer.appendChild(errorDiv);
      }

      // Faire défiler à nouveau vers le bas après la réponse
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  </script>

</body>
</html>
