<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Chatbot Chaleureux | Luxe Boutique</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --primary: #C8A882; /* Beige doré */
      --secondary: #B8860B; /* Or vieux */
      --accent: #D4AF37; /* Or pâle */
      --dark: #4A2C2A; /* Marron foncé */
      --light: #FDF6E3; /* Crème très clair */
      --danger: #8B0000; /* Rouge bordeaux */
      --text: #5D4037; /* Marron clair */
      --success: #8FBC8F; /* Vert doux */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--light);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-image: radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.8) 0%, rgba(253, 246, 227, 0.9) 100%);
    }

    /* ---- EN-TÊTE ---- */
    header {
      background: linear-gradient(135deg, var(--dark), var(--primary));
      padding: 1.2rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(74, 44, 42, 0.2);
      border-bottom: 1px solid rgba(200, 168, 130, 0.2);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--accent) !important;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
    }

    /* ---- ZONE DE DISCUSSION (CHAT) ---- */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(74, 44, 42, 0.05);
      border: 1px solid rgba(200, 168, 130, 0.1);
    }

    /* Style de base d'un message */
    .message {
      max-width: 75%;
      padding: 1rem 1.3rem;
      border-radius: 20px;
      font-size: 1rem;
      line-height: 1.6;
      word-wrap: break-word;
      animation: fadeIn 0.4s ease;
      box-shadow: 0 2px 8px rgba(74, 44, 42, 0.08);
    }

    /* Ajustement pour aligner l'icône de robot au-dessus du texte mis en forme */
    .bot-message-content {
      margin-top: 5px;
    }

    /* Style pour les listes générées par l'IA afin qu'elles restent dans la bulle */
    .bot-message-content ul, .bot-message-content ol {
      margin-left: 20px;
      padding-left: 5px;
    }

    .bot-message-content p {
      margin-bottom: 8px;
    }
    
    .bot-message-content p:last-child {
      margin-bottom: 0;
    }

    /* Bulle de l'utilisateur (à droite) */
    .user-message {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }

    /* Bulle du Bot (à gauche) */
    .bot-message {
      background-color: white;
      color: var(--text);
      align-self: flex-start;
      border: 1px solid rgba(200, 168, 130, 0.3);
    }

    /* Bulle d'erreur (en cas de problème) */
    .error-message {
      background-color: #fcece6;
      color: var(--danger);
      align-self: center;
      border-radius: 10px;
      font-size: 0.9rem;
      border: 1px dashed rgba(139, 0, 0, 0.3);
    }

    /* ---- BARRE DE SAISIE ---- */
    #input-container {
      padding: 1.5rem 2rem;
      background-color: white;
      border-top: 1px solid rgba(200, 168, 130, 0.2);
      box-shadow: 0 -2px 10px rgba(74, 44, 42, 0.05);
      display: flex;
      gap: 1rem;
    }

    #user-input {
      flex: 1;
      padding: 0.8rem 1.2rem;
      border: 1px solid var(--primary);
      border-radius: 50px;
      font-size: 1rem;
      outline: none;
      background-color: rgba(253, 246, 227, 0.8);
      color: var(--text);
    }

    #send-button {
      padding: 0.8rem 1.5rem;
      background: linear-gradient(135deg, var(--secondary), var(--accent));
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(184, 134, 11, 0.3);
    }

    #send-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(184, 134, 11, 0.4);
    }

    /* ---- ANIMATIONS ---- */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---- SCROLLBAR ---- */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--light);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--secondary);
    }

    /* Responsive */
    @media (max-width: 768px) {
      header h1 {
        font-size: 1.6rem;
      }

      #chat-container {
        padding: 1.2rem;
      }

      #input-container {
        padding: 1rem;
        flex-direction: column;
      }

      #user-input, #send-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1><i class="fas fa-comments me-2"></i>Mon Assistant IA</h1>
  </header>

  <div id="chat-container">
    <div class="message bot-message">
      <i class="fas fa-robot me-1"></i> Bonjour ! Comment puis-je vous aider aujourd'hui ?
    </div>
  </div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="Écrivez votre message ici...">
    <button id="send-button">
      <i class="fas fa-paper-plane"></i> Envoyer
    </button>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById('user-input');
      const chatContainer = document.getElementById('chat-container');
      const messageText = input.value.trim();
      
      if (!messageText) return;

      // 1. Ajouter le message de l'utilisateur à l'écran (Texte brut sécurisé)
      const userMessage = document.createElement('div');
      userMessage.className = 'message user-message';
      userMessage.innerHTML = `<i class="fas fa-user me-1"></i> `;
      
      // Utilisation d'un span de texte pour éviter les failles XSS côté utilisateur
      const textSpan = document.createElement('span');
      textSpan.textContent = messageText;
      userMessage.appendChild(textSpan);
      
      chatContainer.appendChild(userMessage);

      // Vider l'input et faire défiler vers le bas
      input.value = '';
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        // 2. Appeler le serveur backend
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: messageText
          })
        });

        const data = await response.json();

        // 3. Créer la bulle de réponse du Bot
        const botMessage = document.createElement('div');
        
        if (data.reply && data.reply.startsWith("Erreur")) {
          botMessage.className = 'message error-message';
          botMessage.innerHTML = `<i class="fas fa-exclamation-triangle me-1"></i> ${data.reply}`;
        } else {
          botMessage.className = 'message bot-message';
          
          // MODIFICATION : On transforme le Markdown de l'IA en HTML propre grâce à marked.parse()
          const htmlReply = marked.parse(data.reply);
          botMessage.innerHTML = `<i class="fas fa-robot me-1"></i><div class="bot-message-content">${htmlReply}</div>`;
        }
        
        chatContainer.appendChild(botMessage);

      } catch (error) {
        // Gestion des pannes réseaux
        const errorMessage = document.createElement('div');
        errorMessage.className = 'message error-message';
        errorMessage.innerHTML = `<i class="fas fa-wifi me-1"></i> Erreur : Impossible de contacter l'IA pour le moment.`;
        chatContainer.appendChild(errorMessage);
      }

      // Faire défiler automatiquement vers le bas après la réponse
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Événement Clic sur le bouton
    document.getElementById('send-button').addEventListener('click', sendMessage);

    // Événement Touche Entrée
    document.getElementById('user-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>
</html>
