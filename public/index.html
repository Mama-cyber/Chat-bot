<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Axiom</title>
    <link rel="icon" type="image/png" href="logo-Axiom.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Coloration syntaxique type VSCode (Atom One Dark) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  </head>
  <body>
    <div id="app-container">
      <aside id="sidebar">
        <button id="new-chat-btn" onclick="startNewChat()">
          <i class="fas fa-plus"></i> Nouveau chat
        </button>
        <div id="history-list"></div>
      </aside>

      <main id="main-chat">
        <header>
          <button id="menu-toggle" onclick="toggleSidebar(event)">
            <i class="fas fa-bars"></i>
          </button>
          <h1><a href="https://mon-chatbot-ia.onrender.com/">Axiom</a></h1>
        </header>

        <div id="chat-container"></div>

        <div id="input-area">
          <div id="generation-options">
            <div class="option-select-group">
              <i class="fas fa-text-height"></i>
              <select id="option-length">
                <option value="court">Court</option>
                <option value="moyen" selected>Moyen</option>
                <option value="long">Long</option>
              </select>
            </div>
            <div class="option-select-group">
              <i class="fas fa-graduation-cap"></i>
              <select id="option-level">
                <option value="debutant" selected>Débutant</option>
                <option value="expert">Expert</option>
              </select>
            </div>
          </div>

          <div id="preview-container">
            <span id="preview-content"></span>
            <i class="fas fa-times" id="remove-file" onclick="clearFile()"></i>
          </div>

          <div id="input-container">
            <label class="file-upload-btn" for="file-input">
              <i class="fas fa-paperclip"></i>
            </label>
            <input
              type="file"
              id="file-input"
              style="display: none"
              onchange="handleFileSelect(this)"
            />

            <textarea
              id="user-input"
              placeholder="Écrivez votre message..."
              rows="1"
            ></textarea>
            <button id="send-button" onclick="handleActionClick()">
              <i class="fas fa-paper-plane" id="button-icon"></i>
            </button>
          </div>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
