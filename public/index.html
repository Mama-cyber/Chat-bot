<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axiom</title>
  <link rel="icon" href="../logo-Axiom.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --primary: #C8A882;
      --secondary: #B8860B;
      --accent: #D4AF37;
      --dark: #4A2C2A;
      --light: #FDF6E3;
      --danger: #8B0000;
      --text: #5D4037;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--light);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: linear-gradient(135deg, var(--dark), var(--primary));
      padding: 1.2rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(74, 44, 42, 0.2);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--accent) !important;
      font-weight: 700;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .message {
      max-width: 75%;
      padding: 1rem 1.3rem;
      border-radius: 20px;
      font-size: 1rem;
      line-height: 1.6;
      word-wrap: break-word;
      animation: fadeIn 0.4s ease;
      box-shadow: 0 2px 8px rgba(74, 44, 42, 0.08);
    }

    .user-message {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }

    .bot-message {
      background-color: white;
      color: var(--text);
      align-self: flex-start;
      border: 1px solid rgba(200, 168, 130, 0.3);
    }

    .loading-message {
      background-color: rgba(255, 255, 255, 0.5);
      color: var(--primary);
      font-style: italic;
    }

    .error-message {
      background-color: #fcece6;
      color: var(--danger);
      align-self: center;
    }

    /* ---- ZONE DE SAISIE & PIÈCES JOINTES ---- */
    #input-area {
      background-color: white;
      border-top: 1px solid rgba(200, 168, 130, 0.2);
      box-shadow: 0 -2px 10px rgba(74, 44, 42, 0.05);
      padding: 1rem 2rem;
    }

    /* Zone d'aperçu du fichier sélectionné */
    #preview-container {
      max-width: 800px;
      margin: 0 auto 0.5rem auto;
      display: none;
      align-items: center;
      gap: 10px;
      background: #fcfaf7;
      padding: 8px 15px;
      border-radius: 10px;
      border: 1px solid var(--primary);
      font-size: 0.9rem;
    }

    #preview-container img {
      max-height: 40px;
      border-radius: 5px;
    }

    #remove-file {
      color: var(--danger);
      cursor: pointer;
      margin-left: auto;
    }

    #input-container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    #user-input {
      flex: 1;
      padding: 0.8rem 1.2rem;
      border: 1px solid var(--primary);
      border-radius: 50px;
      font-size: 1rem;
      outline: none;
      background-color: rgba(253, 246, 227, 0.8);
    }

    /* Style du bouton trombone (Upload) */
    .file-upload-btn {
      background-color: rgba(253, 246, 227, 0.8);
      border: 1px solid var(--primary);
      color: var(--text);
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .file-upload-btn:hover {
      background-color: var(--primary);
      color: white;
    }

    #send-button {
      padding: 0.8rem 1.5rem;
      background: linear-gradient(135deg, var(--secondary), var(--accent));
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      height: 45px;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>
    <h1><i class="fas fa-comments me-2"></i>Axiom</h1>
  </header>

  <div id="chat-container">
    <div class="message bot-message"><i class="fas fa-robot me-1"></i> Bonjour, que puis-je faire pour vous ?</div>
  </div>

  <div id="input-area">
    <div id="preview-container" id="preview-box">
      <span id="preview-content"></span>
      <i class="fas fa-times" id="remove-file" onclick="clearFile()"></i>
    </div>

    <div id="input-container">
      <label class="file-upload-btn" for="file-input">
        <i class="fas fa-paperclip"></i>
      </label>
      <input type="file" id="file-input" style="display:none;" onchange="handleFileSelect(this)">

      <input type="text" id="user-input" placeholder="Écrivez votre message ici...">
      <button id="send-button" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    let selectedFile = null; // Stocke temporairement le fichier en cours d'envoi

    // Fonction déclenchée quand l'utilisateur choisit un fichier
    function handleFileSelect(input) {
      const file = input.files[0];
      if (!file) return;

      selectedFile = { name: file.name, type: file.type };
      const reader = new FileReader();

      const previewContainer = document.getElementById("preview-container");
      const previewContent = document.getElementById("preview-content");

      if (file.type.startsWith("image/")) {
        // Si c'est une image, on l'encode en Base64 pour l'aperçu et pour l'API
        reader.onload = function(e) {
          selectedFile.base64 = e.target.result;
          previewContent.innerHTML = `<img src="${e.target.result}"> <span>${file.name}</span>`;
          previewContainer.style.display = "flex";
        };
        reader.readAsDataURL(file);
      } else {
        // Si c'est un fichier texte (txt, logs, json, js, html...)
        reader.onload = function(e) {
          selectedFile.text = e.target.result;
          previewContent.innerHTML = `<i class="fas fa-file-alt"></i> <span>${file.name}</span>`;
          previewContainer.style.display = "flex";
        };
        reader.readAsText(file);
      }
    }

    // Annuler la sélection du fichier
    function clearFile() {
      selectedFile = null;
      document.getElementById("file-input").value = "";
      document.getElementById("preview-container").style.display = "none";
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const chatContainer = document.getElementById('chat-container');
      const messageText = input.value.trim();
      
      if (!messageText && !selectedFile) return;

      // 1. Afficher le message utilisateur
      const userMessage = document.createElement('div');
      userMessage.className = 'message user-message';
      let userHTML = `<i class="fas fa-user me-1"></i> `;
      if (selectedFile) {
        userHTML += selectedFile.type.startsWith("image/") ? `[Image: ${selectedFile.name}] ` : `[Document: ${selectedFile.name}] `;
      }
      userMessage.innerHTML = userHTML + (messageText ? `<span>${messageText}</span>` : "");
      chatContainer.appendChild(userMessage);

      // Sauvegarde du fichier à envoyer et nettoyage instantané de l'interface
      const fileToSend = selectedFile;
      clearFile();
      input.value = '';
      chatContainer.scrollTop = chatContainer.scrollHeight;

      // 2. Afficher l'icône de réflexion
      const loadingMessage = document.createElement('div');
      loadingMessage.className = 'message bot-message loading-message';
      loadingMessage.innerHTML = `<i class="fas fa-spinner fa-spin"></i> L'assistant analyse votre demande...`;
      chatContainer.appendChild(loadingMessage);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        // 3. Envoi au serveur
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: messageText,
            fileData: fileToSend // On transmet l'objet contenant le texte ou la base64 de l'image
          })
        });

        const data = await response.json();
        chatContainer.removeChild(loadingMessage);

        // 4. Affichage de la réponse du bot
        const botMessage = document.createElement('div');
        if (data.reply && data.reply.startsWith("Erreur")) {
          botMessage.className = 'message error-message';
          botMessage.innerHTML = `<i class="fas fa-exclamation-triangle me-1"></i> ${data.reply}`;
        } else {
          botMessage.className = 'message bot-message';
          const htmlReply = marked.parse(data.reply);
          botMessage.innerHTML = `<i class="fas fa-robot me-1"></i><div class="bot-message-content">${htmlReply}</div>`;
        }
        chatContainer.appendChild(botMessage);

      } catch (error) {
        if (chatContainer.contains(loadingMessage)) chatContainer.removeChild(loadingMessage);
        const errorMessage = document.createElement('div');
        errorMessage.className = 'message error-message';
        errorMessage.innerHTML = `<i class="fas fa-wifi me-1"></i> Erreur réseau : Impossible d'analyser le fichier.`;
        chatContainer.appendChild(errorMessage);
      }

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    document.getElementById('user-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
