<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Axiom</title>
  <link rel="icon" type="image/png" href="logo-Axiom.png">
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
  <link href="[https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap)" rel="stylesheet">
  
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css)">

  <link rel="stylesheet" href="styles.css">
  <script src="[https://cdn.jsdelivr.net/npm/marked/marked.min.js](https://cdn.jsdelivr.net/npm/marked/marked.min.js)"></script>
  <script src="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js)"></script>
  <script src="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js)"></script>
  <script src="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js)"></script>
  <script src="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js)"></script> <script src="[https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js](https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js)"></script>
</head>
<body>

  <div id="app-container">
    
    <aside id="sidebar">
      <button id="new-chat-btn" onclick="startNewChat()">
        <i class="fas fa-plus"></i> Nouveau chat
      </button>
      <div id="history-list">
      </div>
    </aside>

    <main id="main-chat">
      <header>
        <button id="menu-toggle" onclick="toggleSidebar(event)"><i class="fas fa-bars"></i></button>
        <h1>Axiom</h1>
      </header>

      <div id="chat-container">
      </div>

      <div id="input-area">
        <div id="preview-container">
          <span id="preview-content"></span>
          <i class="fas fa-times" id="remove-file" onclick="clearFile()"></i>
        </div>

        <div id="input-container">
          <label class="file-upload-btn" for="file-input">
            <i class="fas fa-paperclip"></i>
          </label>
          <input type="file" id="file-input" style="display:none;" onchange="handleFileSelect(this)">

          <input type="text" id="user-input" placeholder="Écrivez votre message...">
          <button id="send-button" onclick="handleActionClick()"><i class="fas fa-paper-plane" id="button-icon"></i></button>
        </div>
      </div>
    </main>

  </div>

  <script>
    let selectedFile = null;
    
    // STRUCTURE MULTI-CHATS
    let allChats = JSON.parse(localStorage.getItem('axiom_chats')) || {};
    let currentChatId = null;

    // VARIABLES DE CONTRÔLE
    let isGenerating = false; 
    let currentAbortController = null; 

    // CONFIGURATION DE MARKED POUR LE RENDU SNAPCODE Customisé
    const renderer = new marked.Renderer();
    renderer.code = function(code, infostring) {
      const lang = infostring || 'txt';
      // Structure HTML style Snapcode (Fenêtre Mac + Code)
      return `
        <div class="code-container">
          <div class="code-header">
            <div class="code-buttons">
              <span class="code-dot red"></span>
              <span class="code-dot yellow"></span>
              <span class="code-dot green"></span>
            </div>
            <span class="code-lang">${lang}</span>
          </div>
          <pre><code class="language-${lang}">${escapeHtml(code)}</code></pre>
        </div>
      `;
    };
    marked.setOptions({ renderer: renderer });

    // Fonction utilitaire pour éviter que le HTML brut casse la page dans les balises code
    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    window.onload = function() {
      renderSidebar();
      if (Object.keys(allChats).length > 0) {
        const sortedIds = Object.keys(allChats).sort((a,b) => allChats[b].updatedAt - allChats[a].updatedAt);
        loadChat(sortedIds[0]);
      } else {
        startNewChat();
      }
    };

    // Fermeture automatique au clic à l'extérieur sur mobile
    document.addEventListener('click', function(event) {
      if (window.innerWidth <= 768) {
        const sidebar = document.getElementById('sidebar');
        const menuToggle = document.getElementById('menu-toggle');
        
        if (sidebar.classList.contains('open') && 
            !sidebar.contains(event.target) && 
            !menuToggle.contains(event.target)) {
          sidebar.classList.remove('open');
        }
      }
    });

    function renderSidebar() {
      const listContainer = document.getElementById('history-list');
      listContainer.innerHTML = '';
      
      const sortedIds = Object.keys(allChats).sort((a,b) => allChats[b].updatedAt - allChats[a].updatedAt);
      
      sortedIds.forEach(id => {
        const item = document.createElement('div');
        item.className = `history-item ${id === currentChatId ? 'active' : ''}`;
        
        const textSpan = document.createElement('span');
        textSpan.className = 'history-item-text';
        textSpan.innerHTML = `<i class="fas fa-comment-alt"></i> ${allChats[id].title}`;
        textSpan.onclick = () => {
          if (isGenerating) return; 
          loadChat(id);
          if(window.innerWidth <= 768) {
            document.getElementById('sidebar').classList.remove('open');
          }
        };

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-chat-btn';
        deleteBtn.innerHTML = `<i class="fas fa-trash-alt"></i>`;
        deleteBtn.title = "Supprimer cette discussion";
        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          if (isGenerating) return;
          deleteChat(id);
        };

        item.appendChild(textSpan);
        item.appendChild(deleteBtn);
        listContainer.appendChild(item);
      });
    }

    function startNewChat() {
      if (isGenerating) return;
      currentChatId = 'chat_' + Date.now();
      allChats[currentChatId] = {
        title: "Nouvelle discussion",
        history: [{ role: "assistant", content: "Bonjour, comment puis-je vous aider aujourd'hui ?" }],
        updatedAt: Date.now()
      };
      saveToStorage();
      loadChat(currentChatId);
    }

    function loadChat(id) {
      currentChatId = id;
      renderSidebar();
      
      const chatContainer = document.getElementById('chat-container');
      chatContainer.innerHTML = '';
      
      allChats[id].history.forEach(msg => {
        if (msg.role === 'user' && Array.isArray(msg.content)) {
          displayMessage('user', msg.content[0].text, true);
        } else if (msg.role === 'user' && msg.content.includes("Voici le contenu du fichier joint")) {
          const extraction = msg.content.split('\n\nQuestion : ')[1] || "Analyse de document";
          displayMessage('user', `[Document joint] ${extraction}`, true);
        } else {
          displayMessage(msg.role, msg.content, true);
        }
      });
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function deleteChat(id) {
      if (confirm("Voulez-vous vraiment supprimer cette discussion ?")) {
        delete allChats[id];
        saveToStorage();
        
        if (currentChatId === id) {
          const remainingIds = Object.keys(allChats);
          if (remainingIds.length > 0) {
            const nextChatId = remainingIds.sort((a,b) => allChats[b].updatedAt - allChats[a].updatedAt)[0];
            loadChat(nextChatId);
          } else {
            startNewChat();
          }
        } else {
          renderSidebar();
        }
      }
    }

    function saveToStorage() {
      localStorage.setItem('axiom_chats', JSON.stringify(allChats));
    }

    function toggleSidebar(event) {
      if(event) event.stopPropagation();
      const sidebar = document.getElementById('sidebar');
      if (window.innerWidth <= 768) {
        sidebar.classList.toggle('open');
      } else {
        sidebar.classList.toggle('closed');
      }
    }

    function handleFileSelect(input) {
      const file = input.files[0];
      if (!file) return;

      selectedFile = { name: file.name, type: file.type };
      const reader = new FileReader();
      const previewContainer = document.getElementById("preview-container");
      const previewContent = document.getElementById("preview-content");

      if (file.type.startsWith("image/")) {
        reader.onload = function(e) {
          selectedFile.base64 = e.target.result;
          previewContent.innerHTML = `<img src="${e.target.result}"> <span>${file.name}</span>`;
          previewContainer.style.display = "flex";
        };
        reader.readAsDataURL(file);
      } else {
        reader.onload = function(e) {
          let rawText = e.target.result;
          let cleanText = rawText.replace(/<style[^>]*>[\s\S]*?<\/style>/gi, '');
          cleanText = cleanText.replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '');
          cleanText = cleanText.replace(/<[^>]+>/g, ' '); 
          cleanText = cleanText.replace(/[^a-zA-Z0-9àâäéèêëîïôöùûüçÀÂÄÉÈÊËÎÏÔÖÙÛÜÇ\s.,!?;:()'\-""\n]/g, ' ');
          cleanText = cleanText.replace(/\s+/g, ' ').trim(); 

          if (cleanText.length > 80000) {
            cleanText = cleanText.substring(0, 80000) + "... [Texte extrait et condensé]";
          }

          selectedFile.text = cleanText;
          previewContent.innerHTML = `<i class="fas fa-file-alt"></i> <span>${file.name}</span>`;
          previewContainer.style.display = "flex";
        };
        reader.readAsText(file);
      }
    }

    function clearFile() {
      selectedFile = null;
      document.getElementById("file-input").value = "";
      document.getElementById("preview-container").style.display = "none";
    }

    function copyText(button, textToCopy) {
      navigator.clipboard.writeText(textToCopy).then(() => {
        button.classList.add('copied');
        button.innerHTML = `<i class="fas fa-check"></i>`;
        setTimeout(() => {
          button.classList.remove('copied');
          button.innerHTML = `<i class="fas fa-copy"></i>`;
        }, 2000);
      }).catch(err => { console.error(err); });
    }

    function displayMessage(role, text, isHistoryLoad = false) {
      const chatContainer = document.getElementById('chat-container');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}-message`;
      
      let htmlContent = role === 'user' ? `<i class="fas fa-user me-1"></i> ` : `<i class="fas fa-robot me-1"></i> `;
      
      msgDiv.innerHTML = `
        <button class="copy-btn"><i class="fas fa-copy"></i></button>
        <div class="message-text-content">${htmlContent}<span class="render-zone"></span></div>
      `;
      
      if (role === 'user') {
        msgDiv.querySelector('.render-zone').textContent = text;
      } else {
        msgDiv.querySelector('.render-zone').innerHTML = `<div class="bot-message-content">${marked.parse(text)}</div>`;
        // Coloration syntaxique au chargement de l'historique
        Prism.highlightAllUnder(msgDiv);
      }
      
      msgDiv.querySelector('.copy-btn').onclick = function() { copyText(this, text); };
      chatContainer.appendChild(msgDiv);
      if(!isHistoryLoad) chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    function handleActionClick() {
      if (isGenerating) {
        stopGeneration();
      } else {
        sendMessage();
      }
    }

    function stopGeneration() {
      if (currentAbortController) {
        currentAbortController.abort(); 
      }
    }

    async function sendMessage() {
      const input = document.getElementById('user-input');
      const chatContainer = document.getElementById('chat-container');
      const messageText = input.value.trim();
      const sendButton = document.getElementById('send-button');
      const buttonIcon = document.getElementById('button-icon');
      
      if (!messageText && !selectedFile) return;

      isGenerating = true;
      buttonIcon.className = "fas fa-stop";
      sendButton.style.background = "linear-gradient(135deg, var(--secondary), var(--accent))";

      currentAbortController = new AbortController();
      const { signal } = currentAbortController;

      if (allChats[currentChatId].title === "Nouvelle discussion") {
        allChats[currentChatId].title = messageText ? messageText.substring(0, 24) + "..." : "Analyse de fichier";
      }

      let viewText = messageText;
      if (selectedFile) {
        viewText = (selectedFile.type.startsWith("image/") ? `[Image: ${selectedFile.name}] ` : `[Document: ${selectedFile.name}] `) + viewText;
      }
      displayMessage('user', viewText);

      let contentStructure;
      if (selectedFile) {
        if (selectedFile.type.startsWith("image/")) {
          contentStructure = [
            { type: "text", text: messageText || "Analyse cette image." },
            { type: "image_url", image_url: { url: selectedFile.base64 } }
          ];
        } else {
          contentStructure = `Voici le contenu du fichier joint (${selectedFile.name}) :\n---\n${selectedFile.text}\n---\n\nQuestion : ${messageText}`;
        }
      } else {
        contentStructure = messageText;
      }

      allChats[currentChatId].history.push({ role: "user", content: contentStructure });
      allChats[currentChatId].updatedAt = Date.now();
      saveToStorage();
      renderSidebar();

      clearFile();
      input.value = '';

      const botMessage = document.createElement('div');
      botMessage.className = 'message bot-message';
      botMessage.innerHTML = `
        <button class="copy-btn"><i class="fas fa-copy"></i></button>
        <div class="message-text-content">
          <i class="fas fa-robot me-1"></i><span class="render-zone"><i class="fas fa-spinner fa-spin"></i> Axiom se connecte...</span>
        </div>
      `;
      chatContainer.appendChild(botMessage);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      const renderZone = botMessage.querySelector('.render-zone');
      let fullResponseText = ""; 

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ history: allChats[currentChatId].history }),
          signal: signal 
        });

        if (!response.ok) throw new Error("Erreur serveur");

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            const cleanedLine = line.trim();
            if (!cleanedLine) continue;
            if (cleanedLine === "data: [DONE]") continue;

            if (cleanedLine.startsWith("data: ")) {
              try {
                const parsed = JSON.parse(cleanedLine.replace(/^data: /, ""));
                
                if (parsed.error) {
                  renderZone.innerHTML = `<span style="color: var(--danger);"><i class="fas fa-exclamation-triangle"></i> ${parsed.error}</span>`;
                  botMessage.className = 'message error-message';
                  finalizeGenerationState();
                  return;
                }

                if (parsed.content) {
                  fullResponseText += parsed.content;
                  renderZone.innerHTML = `<div class="bot-message-content">${marked.parse(fullResponseText)}</div>`;
                  
                  // FORCE LA RECOLORATION SYNTAXIQUE DU BLOC DE CODE EN COURS DE STREAMING
                  Prism.highlightAllUnder(botMessage);
                  
                  chatContainer.scrollTop = chatContainer.scrollHeight;
                }
              } catch (e) {}
            }
          }
        }

      } catch (error) {
        if (error.name === 'AbortError') {
          console.log("Génération interrompue.");
          fullResponseText += " *[Réponse interrompue]*";
          renderZone.innerHTML = `<div class="bot-message-content">${marked.parse(fullResponseText)}</div>`;
          Prism.highlightAllUnder(botMessage);
        } else {
          console.error("Erreur de flux :", error);
          renderZone.innerHTML = `<span style="color: var(--danger);"><i class="fas fa-wifi"></i> Erreur de flux.</span>`;
          botMessage.className = 'message error-message';
        }
      } finally {
        if (fullResponseText.trim() !== "") {
          botMessage.querySelector('.copy-btn').onclick = function() {
            copyText(this, fullResponseText);
          };
          allChats[currentChatId].history.push({ role: "assistant", content: fullResponseText });
          allChats[currentChatId].updatedAt = Date.now();
          saveToStorage();
        }
        finalizeGenerationState();
      }
    }

    function finalizeGenerationState() {
      isGenerating = false;
      currentAbortController = null;
      document.getElementById('button-icon').className = "fas fa-paper-plane";
      document.getElementById('send-button').style.background = "linear-gradient(135deg, var(--secondary), var(--accent))";
    }

    document.getElementById('user-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') handleActionClick();
    });
  </script>
</body>
</html>
